{% extends "base.html" %}
{% block content %}
  <h2>Đăng nhập EduTest</h2>
  <form method="POST">
    <div>
      <label>Tên đăng nhập:</label>
      <input type="text" name="username" required>
    </div>
    <div>
      <label>Mật khẩu:</label>
      <input type="password" name="password" required>
    </div>
    <button type="submit">Đăng nhập</button>
  </form>
{% endblock %}
